name: Source checks

on:
  push:
    branches: [main, codex/student-portfolio]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx --no-install vitest run --maxWorkers=2 --testTimeout=15000
      - run: npx --no-install vitest run --config vitest.mcp.config.ts --maxWorkers=1 --testTimeout=15000
      - run: npm run check:docs
      - run: npm run build
